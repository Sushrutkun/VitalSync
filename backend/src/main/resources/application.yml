server:
  port: 8083
  address: 0.0.0.0

spring:
  application:
    name: vitalsync-backend

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vitalsync}
    username: ${DB_USER:vitalsync}
    password: ${DB_PASSWORD:vitalsync}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.add.type.headers: false
    consumer:
      group-id: vitalsync-health-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

# Kafka topic configuration
vitalsync:
  kafka:
    topic:
      name: ${KAFKA_TOPIC_NAME:vitalsync-data-ingestion}
      partitions: 3
      replication-factor: 1
  seed:
    count: ${SEED_COUNT:100000}
    users: ${SEED_USERS:500}
    days-back: ${SEED_DAYS_BACK:30}
    log-every: ${SEED_LOG_EVERY:5000}
  auth:
    jwt:
      secret: ${JWT_SECRET:change-me-in-prod-min-256-bits-of-entropy-please}
      access-token-ttl-seconds: 86400      # 24h
      refresh-token-ttl-seconds: 15552000  # 180d (~6mo)
    google:
      client-id: ${GOOGLE_CLIENT_ID:YOUR_WEB_CLIENT_ID_HERE}
  crypto:
    master-key: ${VITALSYNC_CRED_KEY:dev-key-do-not-use-in-prod}
    salt: ${VITALSYNC_CRED_SALT:5f4dcc3b5aa765d6}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.vitalsync: DEBUG
    org.apache.kafka: WARN
